<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BrewCafe icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    svg {
      --bc-brown-500:   hsl(24, 52%, 36%);
      --bc-brown-800:   hsl(20, 52%, 21%);
      --bc-cream:       hsl(36, 60%, 94%);
      --bc-cream-shade: hsl(33, 46%, 82%);
      --bc-crease:      hsl(21, 50%, 24%);
      --bc-ink:         hsl(20, 60%, 8%);
    }
    .tile-top    { stop-color: var(--bc-brown-500); }
    .tile-bottom { stop-color: var(--bc-brown-800); }
    .gloss-top   { stop-color: var(--bc-cream); stop-opacity: 0.16; }
    .gloss-end   { stop-color: var(--bc-cream); stop-opacity: 0; }
    .bean-top    { stop-color: var(--bc-cream); }
    .bean-bottom { stop-color: var(--bc-cream-shade); }
    .tile        { fill: url(#tile); }
    .gloss       { fill: url(#gloss); }
    .rim         { fill: none; stroke: var(--bc-cream); stroke-opacity: 0.14; stroke-width: 2; }
    .bean        { fill: url(#bean); }
    .crease      { fill: none; stroke: var(--bc-crease); stroke-width: 22; stroke-linecap: round; }
  </style>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="tile-top"/>
      <stop offset="1" class="tile-bottom"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="gloss-top"/>
      <stop offset="0.55" class="gloss-end"/>
    </linearGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bean-top"/>
      <stop offset="1" class="bean-bottom"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" style="flood-color: var(--bc-ink); flood-opacity: 0.15"/>
    </filter>
  </defs>

  <!-- squircle tile, continuous-corner style -->
  <path class="tile" d="M115 0 H397 C477 0 512 35 512 115 V397 C512 477 477 512 397 512 H115 C35 512 0 477 0 397 V115 C0 35 35 0 115 0 Z"/>
  <path class="gloss" d="M115 0 H397 C477 0 512 35 512 115 V397 C512 477 477 512 397 512 H115 C35 512 0 477 0 397 V115 C0 35 35 0 115 0 Z"/>
  <path class="rim" d="M115 0 H397 C477 0 512 35 512 115 V397 C512 477 477 512 397 512 H115 C35 512 0 477 0 397 V115 C0 35 35 0 115 0 Z"/>

  <!-- coffee bean -->
  <g transform="rotate(35 256 256)" filter="url(#lift)">
    <ellipse class="bean" cx="256" cy="256" rx="114" ry="160"/>
    <path class="crease" d="M256 114 C208 190 304 322 256 398"/>
  </g>
</svg>
